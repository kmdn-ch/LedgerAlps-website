        <p>LedgerAlps est un logiciel de facturation pour Windows 10/11 spécialement conçu pour les indépendants, artisans et PME en Suisse. Il permet de générer des <strong>QR-Factures suisses conformes aux normes SIX (SPS v2.3)</strong>, avec QR-IBAN et référence structurée, en respectant la <strong>nLPD</strong> et le <strong>Code des Obligations</strong>.</p>
        <h2>Caractéristiques principales :</h2>
        <ul>
          <li><strong>100% On-Premise & Hors-Ligne :</strong> Vos données restent sur votre ordinateur sans aucun cloud externe.</li>
          <li><strong>Gratuit & Libre :</strong> 0 CHF / an, sans abonnement, sans limite de factures ni de clients.</li>
          <li><strong>Normes SIX & QR-Facture :</strong> Génération native en CHF et EUR, référence modulo 10 récursive à 27 chiffres.</li>
          <li><strong>Conformité nLPD & CO :</strong> Traçabilité des écritures comptables et archivage légal 10 ans (art. 958f CO).</li>
        </ul>
